openapi: 3.0.3
info:
  title: Marketplace API
  version: 1.0.0
  description: API Contract generated from Marketplace SRS/ERD.
servers:
- url: /api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties: true
        request_id:
          type: string
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        pages:
          type: integer
    Money:
      type: string
      format: decimal
      description: مقدار پولی؛ float ممنوع است.
paths:
  /auth/otp/request/:
    post:
      tags:
      - احراز هویت و حساب کاربری
      summary: درخواست OTP
      operationId: post_auth_otp_request
      description: 'Permission: -


        Request: phone, purpose


        Response: request_id, expires_in, resend_after


        Notes: برای هر phone+purpose فقط یک OTP فعال نگهداری شود.'
      responses:
        '200':
          description: Success
        '400':
          description: Validation/Business error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: phone, purpose
  /auth/otp/verify/:
    post:
      tags:
      - احراز هویت و حساب کاربری
      summary: تأیید OTP
      operationId: post_auth_otp_verify
      description: 'Permission: -


        Request: phone, purpose, code


        Response: access_token, refresh_token, user


        Notes: -'
      responses:
        '200':
          description: Success
        '400':
          description: Validation/Business error
          content:
            application/json:
              schema:
