<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سبزینه — مدیریت نظرات</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0F1A14;--bg2:#131E11;--bg3:#192318;
  --surf:#1C2B1A;--surf2:#223021;
  --bdr:rgba(255,255,255,0.06);--bdr2:rgba(255,255,255,0.11);
  --fg:#52936B;--fg2:#6BAD83;
  --gold:#C8A84B;--gold-l:#F0DFA0;
  --txt:#E8F0E9;--txt2:rgba(232,240,233,0.6);--txt3:rgba(232,240,233,0.32);
  --red:#E05454;--red-l:rgba(224,84,84,0.12);
  --blue:#4A9EDB;--blue-l:rgba(74,158,219,0.12);
  --amber:#D4925A;--amber-l:rgba(212,146,90,0.12);
}
body{font-family:'Vazirmatn',sans-serif;background:var(--bg);color:var(--txt);direction:rtl;min-height:100vh;display:flex}
.sidebar{width:220px;min-height:100vh;background:var(--bg2);border-left:1px solid var(--bdr);display:flex;flex-direction:column;position:fixed;right:0;top:0;bottom:0;z-index:100}
.sb-logo{padding:18px 16px 14px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:9px}
.sb-lm{width:31px;height:31px;background:var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#1a1a0a}
.sb-lt{font-size:13px;font-weight:800;color:var(--txt)}
.sb-lt small{display:block;font-size:10px;font-weight:400;color:var(--txt3)}
.sb-sec{padding:14px 14px 5px;font-size:9px;font-weight:700;color:var(--txt3);letter-spacing:1.2px;text-transform:uppercase}
.sb-item{display:flex;align-items:center;gap:9px;padding:8px 11px;margin:1px 7px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;color:var(--txt2);transition:all .15s;border:1px solid transparent}
.sb-item:hover{background:var(--surf);color:var(--txt)}
.sb-item.on{background:rgba(82,147,107,0.12);color:var(--fg2);border-color:rgba(82,147,107,0.18)}
.sb-item i{font-size:16px;flex-shrink:0}
.sb-badge{margin-right:auto;font-size:9px;font-weight:700;padding:2px 6px;border-radius:7px;background:var(--red);color:#fff}
.sb-bottom{margin-top:auto;border-top:1px solid var(--bdr);padding:10px 7px}
.sb-user{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer}
.sb-av{width:28px;height:28px;border-radius:50%;background:rgba(82,147,107,0.15);border:1px solid rgba(82,147,107,0.25);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--fg2)}
.sb-uname{font-size:11px;font-weight:700;color:var(--txt)}
.sb-urole{font-size:10px;color:var(--txt3)}
.sb-out{margin-right:auto;color:var(--txt3);font-size:14px;cursor:pointer}

.main{margin-right:220px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{background:var(--bg2);border-bottom:1px solid var(--bdr);height:50px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.tb-title{font-size:14px;font-weight:800;color:var(--txt)}
.tb-sub{font-size:10px;color:var(--txt3)}
.tb-right{display:flex;align-items:center;gap:8px}
.tb-search{background:var(--surf);border:1px solid var(--bdr2);border-radius:8px;display:flex;align-items:center;gap:6px;padding:0 10px;height:30px;width:200px}
.tb-search input{background:transparent;border:none;outline:none;color:var(--txt);font-size:11px;font-family:'Vazirmatn',sans-serif;flex:1;direction:rtl}
.tb-search input::placeholder{color:var(--txt3)}

.content{padding:18px 20px 40px;flex:1}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat-card{background:var(--surf);border:1px solid var(--bdr);border-radius:10px;padding:13px 14px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
.stat-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px}
.stat-card.all::after{background:var(--txt3)}
.stat-card.pend::after{background:var(--amber)}
.stat-card.app::after{background:var(--fg)}
.stat-card.rej::after{background:var(--red)}
.stat-card.active-filter{border-color:var(--fg2);background:rgba(82,147,107,0.06)}
.sc-num{font-size:22px;font-weight:900;color:var(--txt);margin-bottom:3px}
.sc-lbl{font-size:10px;color:var(--txt3);display:flex;align-items:center;gap:5px}
.sc-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

.filters-bar{background:var(--surf);border:1px solid var(--bdr);border-radius:10px;padding:11px 14px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.fb-search{background:var(--bg3);border:1px solid var(--bdr2);border-radius:7px;display:flex;align-items:center;gap:6px;padding:0 10px;height:32px;flex:1}
.fb-search input{background:transparent;border:none;outline:none;color:var(--txt);font-size:12px;font-family:'Vazirmatn',sans-serif;flex:1;direction:rtl}
.fb-search input::placeholder{color:var(--txt3)}
.fsel{height:32px;background:var(--bg3);border:1px solid var(--bdr2);border-radius:7px;padding:0 10px;font-size:11px;font-family:'Vazirmatn',sans-serif;color:var(--txt2);outline:none;cursor:pointer}

.review-list{display:flex;flex-direction:column;gap:10px}
.rcard{background:var(--surf);border:1px solid var(--bdr);border-radius:12px;padding:16px;display:flex;gap:14px}
.rcard.pending{border-color:rgba(212,146,90,0.3)}
.rc-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.rc-body{flex:1}
.rc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.rc-user{font-size:12px;font-weight:700;color:var(--txt)}
.rc-date{font-size:10px;color:var(--txt3);margin-right:6px}
.rc-stars{color:var(--gold);font-size:12px}
.rc-status{font-size:9px;font-weight:700;padding:3px 8px;border-radius:5px}
.st-pending{background:var(--amber-l);color:var(--amber)}
.st-approved{background:rgba(82,147,107,0.15);color:var(--fg2)}
.st-rejected{background:var(--red-l);color:var(--red)}

.rc-product{display:flex;align-items:center;gap:7px;margin-bottom:8px;background:var(--bg3);border-radius:7px;padding:6px 10px;width:fit-content}
.rc-product-img{font-size:14px}
.rc-product-name{font-size:10px;color:var(--txt2);font-weight:600}

.rc-text{font-size:12px;color:var(--txt2);line-height:1.8;margin-bottom:10px}
.rc-verified{display:inline-flex;align-items:center;gap:4px;background:rgba(82,147,107,0.1);color:var(--fg2);font-size:9px;font-weight:600;padding:2px 7px;border-radius:4px;margin-bottom:10px}

.rc-actions{display:flex;gap:7px}
.btn-approve{height:30px;background:rgba(82,147,107,0.12);border:1px solid rgba(82,147,107,0.25);border-radius:7px;padding:0 13px;font-size:11px;font-weight:700;color:var(--fg2);cursor:pointer;font-family:'Vazirmatn',sans-serif;display:flex;align-items:center;gap:5px}
.btn-reject{height:30px;background:var(--red-l);border:1px solid rgba(224,84,84,0.25);border-radius:7px;padding:0 13px;font-size:11px;font-weight:700;color:var(--red);cursor:pointer;font-family:'Vazirmatn',sans-serif;display:flex;align-items:center;gap:5px}
.btn-reply{height:30px;background:var(--bg3);border:1px solid var(--bdr2);border-radius:7px;padding:0 13px;font-size:11px;font-weight:700;color:var(--txt2);cursor:pointer;font-family:'Vazirmatn',sans-serif;display:flex;align-items:center;gap:5px}
.btn-delete-r{height:30px;width:30px;background:transparent;border:1px solid var(--bdr2);border-radius:7px;cursor:pointer;color:var(--txt3);display:flex;align-items:center;justify-content:center}
.btn-delete-r:hover{border-color:var(--red);color:var(--red)}

.admin-reply{background:rgba(82,147,107,0.06);border-right:2px solid var(--fg);border-radius:0 8px 8px 0;padding:9px 12px;margin-top:10px;font-size:11px;color:var(--txt2);line-height:1.7}
.admin-reply strong{color:var(--fg2);display:block;margin-bottom:3px;font-size:10px}

.reply-box{display:none;margin-top:10px;gap:7px}
.reply-box.show{display:flex}
.reply-input{flex:1;height:34px;background:var(--bg3);border:1px solid var(--bdr2);border-radius:7px;padding:0 10px;font-size:11px;font-family:'Vazirmatn',sans-serif;color:var(--txt);outline:none;direction:rtl}
.reply-input:focus{border-color:var(--fg)}
.btn-send-reply{height:34px;background:var(--fg);color:#fff;border:none;border-radius:7px;padding:0 14px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Vazirmatn',sans-serif}

.toast{position:fixed;bottom:20px;left:20px;background:var(--surf2);border:1px solid var(--bdr2);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--txt);z-index:500;transform:translateY(70px);opacity:0;transition:all .3s}
.toast.show{transform:translateY(0);opacity:1}
.toast i{color:#52C97A;font-size:15px}
</style>
</head>
<body>

<div class="sidebar">
  <div class="sb-logo"><div class="sb-lm">س</div><div class="sb-lt">سبزینه <small>پنل مدیریت</small></div></div>
  <div class="sb-sec">اصلی</div>
  <div class="sb-item" onclick="nav(this)"><i class="ti ti-layout-dashboard"></i> داشبورد</div>
  <div class="sb-item" onclick="nav(this)"><i class="ti ti-chart-bar"></i> گزارش‌ها</div>
  <div class="sb-sec">فروشگاه</div>
  <div class="sb-item" onclick="nav(this)"><i class="ti ti-receipt"></i> سفارش‌ها</div>
  <div class="sb-item" onclick="nav(this)"><i class="ti ti-shopping-bag"></i> محصولات</div>
  <div class="sb-item" onclick="nav(this)"><i class="ti ti-category"></i> دسته‌بندی‌ها</div>
  <div class="sb-item" onclick="nav(this)"><i class="ti ti-tag"></i> کوپن‌ها</div>
  <div class="sb-sec">کاربران</div>
  <div class="sb-item" onclick="nav(this)"><i class="ti ti-users"></i> کاربران</div>
  <div class="sb-item on" onclick="nav(this)"><i class="ti ti-message-dots"></i> نظرات <span class="sb-badge">۵</span></div>
  <div class="sb-sec">محتوا</div>
  <div class="sb-item" onclick="nav(this)"><i class="ti ti-article"></i> مقالات</div>
  <div class="sb-sec">سیستم</div>
  <div class="sb-item" onclick="nav(this)"><i class="ti ti-settings"></i> تنظیمات</div>
  <div class="sb-bottom">
    <div class="sb-user"><div class="sb-av">مر</div><div><div class="sb-uname">محمد رضایی</div><div class="sb-urole">مدیر ارشد</div></div><i class="ti ti-logout sb-out"></i></div>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <div><div class="tb-title">مدیریت نظرات</div><div class="tb-sub">۱۲۴ نظر در سیستم</div></div>
    <div class="tb-right"><div class="tb-search"><i class="ti ti-search" style="font-size:13px;color:var(--txt3)"></i><input placeholder="جستجو در نظرات..."></div></div>
  </div>

  <div class="content">
    <div class="stats-row">
      <div class="stat-card all active-filter" onclick="filterReviews('all',this)"><div class="sc-num">۱۲۴</div><div class="sc-lbl"><span class="sc-dot" style="background:var(--txt3)"></span> همه نظرات</div></div>
      <div class="stat-card pend" onclick="filterReviews('pending',this)"><div class="sc-num" style="color:var(--amber)">۵</div><div class="sc-lbl"><span class="sc-dot" style="background:var(--amber)"></span> در انتظار تأیید</div></div>
      <div class="stat-card app" onclick="filterReviews('approved',this)"><div class="sc-num" style="color:var(--fg2)">۱۱۲</div><div class="sc-lbl"><span class="sc-dot" style="background:var(--fg)"></span> تأیید شده</div></div>
      <div class="stat-card rej" onclick="filterReviews('rejected',this)"><div class="sc-num" style="color:var(--red)">۷</div><div class="sc-lbl"><span class="sc-dot" style="background:var(--red)"></span> رد شده</div></div>
    </div>

    <div class="filters-bar">
      <div class="fb-search"><i class="ti ti-search" style="font-size:13px;color:var(--txt3)"></i><input placeholder="جستجو در متن نظرات یا نام کاربر..."></div>
      <select class="fsel"><option>همه امتیازها</option><option>۵ ستاره</option><option>۴ ستاره</option><option>۳ ستاره و کمتر</option></select>
      <select class="fsel"><option>همه محصولات</option><option>کود هیومیک اسید</option><option>قطره‌چکان</option></select>
    </div>

    <div class="review-list" id="review-list"></div>
  </div>
</div>

<div class="toast" id="toast"><i class="ti ti-circle-check"></i><span id="toast-msg"></span></div>

<script>
var reviews = [
  {id:1,name:'حسین محمدی',av:'حم',bg:'#3a1c1c',stars:5,date:'۱۴ اردیبهشت ۱۴۰۴',product:'کود هیومیک اسید',pimg:'🌿',text:'نتیجه فوق‌العاده‌ای در گلخانه گوجه‌فرنگیم گرفتم. بعد از دو هفته استفاده تفاوت رشد برگ‌ها کاملاً مشخص بود. حتماً دوباره خرید می‌کنم.',verified:true,status:'pending'},
  {id:2,name:'فاطمه رضایی',av:'فر',bg:'#1a3a5c',stars:5,date:'۳ فروردین ۱۴۰۴',product:'کود هیومیک اسید',pimg:'🌿',text:'بسته‌بندی خوب، محصول اصل. برای باغچه خانگی استفاده کردم، درختان میوه‌ام خیلی شاداب‌تر شدن.',verified:true,status:'approved',reply:'خوشحالیم که نتیجه خوبی گرفتید! ممنون از خریدتون 🌿'},
  {id:3,name:'رضا کاظمی',av:'رک',bg:'#2a1a2a',stars:2,date:'۱ خرداد ۱۴۰۴',product:'قطره‌چکان ۱۰۰ عددی',pimg:'💧',text:'کیفیت پلاستیک پایین بود و دو تا از قطره‌چکان‌ها بعد از یک هفته شکستن. انتظار بهتری داشتم.',verified:true,status:'pending'},
  {id:4,name:'کاربر ناشناس',av:'؟',bg:'#3a3a1a',stars:1,date:'۲۸ اردیبهشت ۱۴۰۴',product:'کاتر باغبانی',pimg:'🔧',text:'تبلیغات مسخره! این محصول هیچ ربطی به توضیحات نداره، حتما از رقیب بخرید بهتره.',verified:false,status:'rejected'},
  {id:5,name:'مریم صادقی',av:'مص',bg:'#1a1c3a',stars:4,date:'۲۰ اردیبهشت ۱۴۰۴',product:'بذر گوجه هیبرید',pimg:'🌱',text:'کیفیت بذر خوب بود، نرخ جوانه‌زنی بالا. فقط بسته‌بندی می‌تونست بهتر باشه.',verified:true,status:'pending'},
  {id:6,name:'علی احمدی',av:'عا',bg:'#1C3829',stars:5,date:'۱۶ خرداد ۱۴۰۴',product:'قطره‌چکان ۱۰۰ عددی',pimg:'💧',text:'محصول دقیقاً طبق توضیحات بود. نصب راحتی داشت و کیفیت ساخت خوبیه.',verified:true,status:'approved'},
];

function renderReviews(list){
  document.getElementById('review-list').innerHTML = list.map(r=>`
    <div class="rcard ${r.status==='pending'?'pending':''}">
      <div class="rc-avatar" style="background:${r.bg}">${r.av}</div>
      <div class="rc-body">
        <div class="rc-top">
          <div><span class="rc-user">${r.name}</span><span class="rc-date">${r.date}</span></div>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="rc-stars">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}</span>
            <span class="rc-status ${r.status==='pending'?'st-pending':r.status==='approved'?'st-approved':'st-rejected'}">${r.status==='pending'?'در انتظار':r.status==='approved'?'تأیید شده':'رد شده'}</span>
          </div>
        </div>
        <div class="rc-product"><span class="rc-product-img">${r.pimg}</span><span class="rc-product-name">${r.product}</span></div>
        <div class="rc-text">${r.text}</div>
        ${r.verified?'<div class="rc-verified"><i class="ti ti-circle-check" style="font-size:9px"></i> خرید تأیید شده</div>':''}
        ${r.reply?`<div class="admin-reply"><strong>پاسخ فروشگاه سبزینه:</strong>${r.reply}</div>`:''}
        <div class="rc-actions">
          ${r.status==='pending'?`
            <button class="btn-approve" onclick="setStatus(${r.id},'approved')"><i class="ti ti-check" style="font-size:11px"></i> تأیید</button>
            <button class="btn-reject" onclick="setStatus(${r.id},'rejected')"><i class="ti ti-x" style="font-size:11px"></i> رد</button>
          `:''}
          <button class="btn-reply" onclick="toggleReply(${r.id})"><i class="ti ti-message-reply" style="font-size:11px"></i> پاسخ</button>
          <button class="btn-delete-r" onclick="deleteReview(${r.id})"><i class="ti ti-trash" style="font-size:12px"></i></button>
        </div>
        <div class="reply-box" id="reply-${r.id}">
          <input class="reply-input" placeholder="پاسخ خود را به عنوان فروشگاه بنویسید...">
          <button class="btn-send-reply" onclick="sendReply(${r.id})">ارسال</button>
        </div>
      </div>
    </div>
  `).join('');
}
renderReviews(reviews);

function filterReviews(status,el){
  document.querySelectorAll('.stat-card').forEach(c=>c.classList.remove('active-filter'));
  el.classList.add('active-filter');
  renderReviews(status==='all'?reviews:reviews.filter(r=>r.status===status));
}
function setStatus(id,status){ var r=reviews.find(x=>x.id===id); if(r){r.status=status;} renderReviews(reviews); showToast(status==='approved'?'نظر تأیید شد':'نظر رد شد'); }
function deleteReview(id){ if(confirm('آیا از حذف این نظر مطمئن هستید؟')){ reviews=reviews.filter(r=>r.id!==id); renderReviews(reviews); showToast('نظر حذف شد'); } }
function toggleReply(id){ document.getElementById('reply-'+id).classList.toggle('show'); }
function sendReply(id){ var r=reviews.find(x=>x.id===id); var inp=document.getElementById('reply-'+id).querySelector('input'); if(inp.value.trim()){ r.reply=inp.value.trim(); renderReviews(reviews); showToast('پاسخ شما ارسال شد'); } }
function nav(el){ document.querySelectorAll('.sb-item').forEach(i=>i.classList.remove('on')); el.classList.add('on'); }
function showToast(msg){ var t=document.getElementById('toast'); t.querySelector('span').textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); }
</script>
</body>
</html>
